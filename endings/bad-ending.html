<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Manor - Trapped</title>

    <link rel="stylesheet" href="../index.css">
    <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Nosifer&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>
    
    <div class="body">

        <div class="headLine">
            <h1 class="line" style="color: #ff3344; animation: easeInOnLoad 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;">You are Trapped</h1>
        </div>

        <div class="card-container">
            <div class="picture from-right">
                <img src="../spooky.jpg" alt="">
            </div>

            <div class="scene from-left">
                <p>
                    You ignored the Bestiary's warnings! Darkness swallows the room as the ghosts close in around you. <br> <br>
                    Down in the Foyer, a brand new glowing card slowly prints itself into the Bestiary book... <br> <br>
                    <b>CLASS I ?? THE LOST VISITOR (YOU)</b>
                </p>
            </div>

            <div class="button-container">
                <a href="../index.html">
                    <button>Try Again</button>
                </a>
            </div>
        </div>

    </div>

    <script src="../animation.js"></script>
</body>
</html>
