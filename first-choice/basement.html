<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Manor - Basement</title>

    <link rel="stylesheet" href="../index.css">
    <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Nosifer&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>

    <div class="body">

        <div class="top-bar">
            <a href="../index.html"><button class="top-btn">Back to Foyer</button></a>
            <button class="top-btn" onclick="toggleEmf()">EMF Vision</button>
        </div>

        <div class="headLine">
            <h1 class="line">
                The Basement
            </h1>
        </div>

        <div class="card-container">

            <div class="picture">
                <img src="basement.jpg" alt="">
            </div>

            <div class="scene">
                <p id="base-text">
                    The heavy iron basement door is locked with a 4-digit keypad. <br><br>
                    A scratched note says: "Combine the Poltergeist hour with the secret attic number."
                </p>

                <div class="code-box">
                    <input type="text" id="pin" maxlength="4" placeholder="0000">
                    <button onclick="unlock()">Unlock</button>
                </div>
            </div>

             <div class="button-container">
                <a href="../index.html">
                    <button>Back To Foyer</button>
                </a>

                <a href="../second-choice/hallway.html">
                    <button>Sneak Into Hallway</button>
                </a>
            </div>
        </div>
    </div>

    <script>
        function toggleEmf() {
            document.body.classList.toggle("emf");
        }

        function unlock() {
            let code = document.getElementById("pin").value;
            let text = document.getElementById("base-text");

            if ( code == "3142") {
                window.location.href = "../endings/good-ending.html";
            } else {
                text.innerHTML = "BZZZT! WRONG CODE! <br><br> Turn on EMF Vision in the Foyer (3 digits) and the Library (final digit) to find the 4 numbers.";
            }
        }
    </script>
    
</body>
</html>
