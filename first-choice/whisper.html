<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Manor - Attic</title>

    <link rel="stylesheet" href="../index.css">
    <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Nosifer&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>
    

    <div class="body">

        <div class="top-bar">
            <a href="../index.html"><button class="top-btn">Back to Foyer</button></a>
            <button class="top-btn" onclick="toggleEmf()">EMF Vision</button>
        </div>

        <div class="headLine">
            <h1 class="line">
                The Dusty Attic
            </h1>
        </div>

        <div class="card-container">

            <div class="picture">
                <img src="kitchen.jpg" alt="">
            </div>

            <div class="scene">
                <p id="story-text">
                    You climb the creaking stairs toward the whispers. In the center of the attic, an old silver gramophone spins by itself. <br><br>
                    A pale weeping spirit rises from the shadows. The windows begin to shake violently! <br><br>
                    <span class="secret">FINAL SAFE DIGIT: 2</span>
                </p>
            </div>

             <div class="button-container" id="attic-buttons">
                <a href="../endings/bad-ending.html">
                    <button>Smash Gramophone</button>
                </a>

                <a href="#" onclick="rightChoice()">
                    <button>Ring Silver Bell</button>
                </a>
            </div>
        </div>

    </div>

    <script>
        function toggleEmf() {
            document.body.classList.toggle("emf");
        }

        function rightChoice() {
            document.getElementById("story-text").innerHTML = "BANSHEE BANISHED! <br><br> The Silver Bell disrupts her scream! As she fades into mist, two hidden doors creak open behind the gramophone. <br><br> <span class='secret'>CLUE: THE 3RD DIGIT MIGHT BE REQUIRE SOME KNOWLEDGE</span>";

            document.getElementById("attic-buttons").innerHTML = `
                <a href="../second-choice/library.html">
                    <button>Enter The Library</button>
                </a>
                <a href="../second-choice/hallway.html">
                    <button>Enter Dark Hallway</button>
                </a>
            `;
        }
    </script>

</body>
</html>
